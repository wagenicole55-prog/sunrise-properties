[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Temporary fallback: keep the public site available through the working AppDeploy backend while Netlify migration is completed.
[[redirects]]
  from = "/*"
  to = "https://sunrise-store-llc-qnih7n.v2.appdeploy.ai/:splat"
  status = 200
