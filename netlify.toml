[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Temporary public fallback while the Netlify backend migration is being completed.
[[redirects]]
  from = "/*"
  to = "https://sunrise-store-llc-qnih7n.v2.appdeploy.ai/:splat"
  status = 200
